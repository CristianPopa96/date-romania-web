name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API types are generated from openapi.json, a copy of the API's schema; a
      # hand edit or a forgotten regeneration fails here.
      - run: pnpm generate-api-types && git diff --exit-code src/lib/api-schema.gen.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Browser tests open the build just made, on the stub API in e2e/stub.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  # On a pull request the image is built, not pushed: a dependency that cannot install in
  # the image fails the PR, not main (api #35 broke the image on main that way).
  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/cristianpopa96/date-romania-web:latest
            ghcr.io/cristianpopa96/date-romania-web:${{ github.sha }}
